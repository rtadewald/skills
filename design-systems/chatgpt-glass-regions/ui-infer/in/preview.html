<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 37px;
      min-width: 386px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(61,61,95,0.350) 0%, rgba(26,28,53,0.350) 25%, rgba(21,22,43,0.350) 50%, rgba(19,20,41,0.350) 75%, rgba(19,18,39,0.350) 100%);
      border: 1px solid rgba(35,36,66,0.500);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(26,27,57,0.450), 0 4px 39px rgba(21,21,45,0.260);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #a0a1c2;
      font-size: 14px;
      font-weight: 400;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
