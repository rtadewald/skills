<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 110px;
      min-width: 158px;
      padding: 0 18px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(115,112,199,0.550) 0%, rgba(152,140,230,0.550) 25%, rgba(109,87,195,0.550) 50%, rgba(71,61,158,0.550) 75%, rgba(61,48,141,0.550) 100%);
      border: 1px solid rgba(39,33,77,0.550);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(41,39,85,0.450), 0 0 40px rgba(32,29,62,0.165);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #a793f0;
      font-size: 38px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
