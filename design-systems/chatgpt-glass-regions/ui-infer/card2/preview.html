<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 152px;
      min-width: 112px;
      padding: 0 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(45,46,85,0.400) 0%, rgba(37,39,75,0.400) 25%, rgba(33,35,69,0.400) 50%, rgba(29,32,63,0.400) 75%, rgba(29,32,63,0.400) 100%);
      border: 1px solid rgba(78,78,127,0.550);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(43,44,89,0.450), 0 0 40px rgba(34,35,72,0.126);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #bbbcdb;
      font-size: 14px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
