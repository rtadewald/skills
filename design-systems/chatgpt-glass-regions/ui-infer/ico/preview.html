<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 24px;
      min-width: 24px;
      padding: 0 18px;
      border-radius: 9px;
      background: linear-gradient(270deg, rgba(135,107,230,0.550) 0%, rgba(172,144,232,0.550) 25%, rgba(182,147,243,0.550) 50%, rgba(173,140,229,0.550) 75%, rgba(170,141,226,0.550) 100%);
      border: 1px solid rgba(169,136,244,0.550);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(163,132,242,0.450), 0 0 40px rgba(99,88,178,0.525);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #b496f2;
      font-size: 11px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
