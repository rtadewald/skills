<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 35px;
      min-width: 200px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(15,13,41,0.157) 0%, rgba(23,18,54,0.157) 25%, rgba(53,36,99,0.157) 50%, rgba(57,38,109,0.157) 75%, rgba(37,24,82,0.157) 100%);
      border: 1px solid rgba(21,17,50,0.307);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(22,19,50,0.450), 0 4px 22px rgba(19,16,46,0.080);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #624d96;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
