<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 179px;
      min-width: 208px;
      padding: 0 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(28,26,58,0.453) 0%, rgba(60,56,90,0.453) 25%, rgba(103,93,158,0.453) 50%, rgba(134,117,219,0.453) 75%, rgba(91,78,179,0.453) 100%);
      border: 1px solid rgba(36,32,68,0.550);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(17,15,46,0.450), 0 0 40px rgba(26,22,53,0.136);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #a997ed;
      font-size: 63px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
