<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 116px;
      min-width: 496px;
      padding: 0 18px;
      border-radius: 24px;
      background: linear-gradient(90deg, rgba(57,54,107,0.550) 0%, rgba(37,37,75,0.550) 25%, rgba(26,26,54,0.550) 50%, rgba(21,19,43,0.550) 75%, rgba(17,15,37,0.550) 100%);
      border: 1px solid rgba(98,85,167,0.550);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(45,46,90,0.450), 0 0 40px rgba(38,36,72,0.080);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #a8a3d6;
      font-size: 14px;
      font-weight: 400;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
