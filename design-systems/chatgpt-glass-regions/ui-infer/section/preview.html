<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 55px;
      min-width: 740px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(270deg, rgba(26,26,52,0.500) 0%, rgba(19,20,40,0.500) 25%, rgba(47,47,69,0.500) 50%, rgba(12,10,29,0.500) 75%, rgba(34,28,66,0.500) 100%);
      border: 1px solid rgba(27,28,58,0.550);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(26,28,54,0.450);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #c6badc;
      font-size: 19px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
