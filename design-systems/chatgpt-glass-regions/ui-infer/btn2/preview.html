<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 42px;
      min-width: 132px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(95,79,165,0.257) 0%, rgba(101,97,151,0.257) 25%, rgba(88,86,136,0.257) 50%, rgba(83,81,128,0.257) 75%, rgba(64,63,107,0.257) 100%);
      border: 1px solid rgba(71,68,129,0.407);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(54,55,103,0.450), 0 0 28px rgba(47,47,96,0.087);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #b6b2e1;
      font-size: 15px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
