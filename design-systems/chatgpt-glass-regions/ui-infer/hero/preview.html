<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 490px;
      min-width: 520px;
      padding: 0 18px;
      border-radius: 11px;
      background: linear-gradient(180deg, rgba(104,95,165,0.200) 0%, rgba(30,29,60,0.200) 25%, rgba(24,24,53,0.200) 50%, rgba(18,19,43,0.200) 75%, rgba(24,24,49,0.200) 100%);
      border: 1px solid rgba(35,35,70,0.350);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(27,28,56,0.450), 0 4px 40px rgba(31,30,63,0.084);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #c9c7e0;
      font-size: 172px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
