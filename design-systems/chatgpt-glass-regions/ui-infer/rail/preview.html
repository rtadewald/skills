<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 620px;
      min-width: 240px;
      padding: 0 18px;
      border-radius: 38px;
      background: linear-gradient(180deg, rgba(97,87,149,0.169) 0%, rgba(71,52,158,0.169) 25%, rgba(20,20,48,0.169) 50%, rgba(13,10,37,0.169) 75%, rgba(16,13,42,0.169) 100%);
      border: 1px solid rgba(30,23,65,0.319);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(46,40,88,0.450), 0 4px 40px rgba(20,18,45,0.467);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #afa0e5;
      font-size: 217px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
