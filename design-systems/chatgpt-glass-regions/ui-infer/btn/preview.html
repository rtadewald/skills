<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 40px;
      min-width: 176px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(23,25,51,0.350) 0%, rgba(51,52,75,0.350) 25%, rgba(48,49,73,0.350) 50%, rgba(24,25,51,0.350) 75%, rgba(26,27,57,0.350) 100%);
      border: 1px solid rgba(28,30,58,0.500);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(24,25,54,0.450), 0 0 27px rgba(25,27,54,0.094);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #b1b2ca;
      font-size: 14px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
