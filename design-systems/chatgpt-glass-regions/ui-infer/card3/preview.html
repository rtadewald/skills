<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI infer — btn</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0612; font-family: Inter, system-ui, sans-serif;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box;
      height: 54px;
      min-width: 204px;
      padding: 0 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(23,19,56,0.130) 0%, rgba(72,69,100,0.130) 25%, rgba(21,18,50,0.130) 50%, rgba(21,17,55,0.130) 75%, rgba(25,21,59,0.130) 100%);
      border: 1px solid rgba(30,26,62,0.280);
      box-shadow: inset 0 1px 0 rgba(200,204,232,0.220), inset 0 1px 0 rgba(27,19,66,0.450), 0 0 30px rgba(24,18,57,0.080);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #b8abdd;
      font-size: 14px;
      font-weight: 500;
      cursor: default;
    }
  </style>
</head>
<body>
  <button class="btn">View all chats <span aria-hidden="true">→</span></button>
</body>
</html>
