<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auskbur Stare</title>
  <style>
    :root {
      --page-tl: #17213a;
      --page-tr: #1e3151;
      --page-bl: #141e37;
      --page-br: #1a2640;
      --page-c: #0e0f27;
      --font: "Avenir Next", Avenir, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 80px);
      color: #f2ddf9;
      font-family: var(--font);
      background:
        radial-gradient(circle at 50% 45%, var(--page-c) 0 17%, transparent 50%),
        linear-gradient(135deg, var(--page-tl), var(--page-tr) 35%, var(--page-br) 72%, var(--page-bl));
    }

    .board {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(280px, .92fr);
      gap: 22px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      --hot: #dbc5f4;
      --rim-tl: #654378;
      --rim-tr: #4d427b;
      --rim-br: #4a3f78;
      --rim-bl: #543267;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 17px;
      box-shadow:
        0 22px 42px rgba(5, 7, 22, .38),
        inset 0 1px rgba(255, 255, 255, .10);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      padding: 1.5px;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(
        from 315deg,
        var(--rim-tl),
        var(--rim-tr) 25%,
        var(--rim-br) 50%,
        var(--rim-bl) 75%,
        var(--rim-tl)
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .card::after {
      content: "";
      position: absolute;
      z-index: 0;
      width: 65%;
      aspect-ratio: 1;
      top: -42%;
      left: -12%;
      border-radius: 50%;
      pointer-events: none;
      opacity: .18;
      filter: blur(20px);
      background: var(--hot);
    }

    .metric {
      min-height: 166px;
      padding: 25px 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-77 {
      --rim-tl: #654378; --rim-tr: #4d427b; --rim-br: #4a3f78; --rim-bl: #543267; --hot: #dbc5f4;
      background: linear-gradient(180deg, #58447d 0%, #917baa 25%, #735f8d 50%, #57417b 75%, #6c568f 100%);
    }

    .metric-450 {
      --rim-tl: #54497a; --rim-tr: #37477c; --rim-br: #39417a; --rim-bl: #493f79; --hot: #b8c3f0;
      color: #e6e7f9;
      background: linear-gradient(90deg, #746e9a 0%, #555786 25%, #9094b6 50%, #667199 75%, #405084 100%);
    }

    .metric-6 {
      --rim-tl: #5b376c; --rim-tr: #473c76; --rim-br: #332e62; --rim-bl: #312656; --hot: #dfc9fa;
      color: #eec8f3;
      background: linear-gradient(180deg, #523c76 0%, #5c457d 25%, #48366d 50%, #5a4b7c 75%, #8b7ca8 100%);
    }

    .metric-53 {
      --rim-tl: #524781; --rim-tr: #3a447f; --rim-br: #303872; --rim-bl: #2c3163; --hot: #cfcaff;
      color: #ddcaf3;
      background: linear-gradient(180deg, #464b87 0%, #6968a0 25%, #55568e 50%, #5c5f96 75%, #7a7fb1 100%);
    }

    .metric-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(255, 255, 255, .62);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .glyph {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 14px;
      box-shadow: 0 0 14px color-mix(in srgb, currentColor 40%, transparent);
    }

    .value {
      position: relative;
      z-index: 1;
      font-size: clamp(38px, 5vw, 56px);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.055em;
      text-shadow: 0 3px 16px rgba(23, 10, 49, .26);
    }

    .label {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: rgba(242, 221, 249, .56);
      font-size: 12px;
      letter-spacing: .01em;
    }

    .roster {
      --rim-tl: #213059; --rim-tr: #223865; --rim-br: #1b315a; --rim-bl: #202c52; --hot: #c3cff9;
      min-height: 346px;
      padding: 24px 25px;
      color: #cdd3f7;
      background: linear-gradient(180deg, #21335b 0%, #27345e 25%, #48557b 50%, #293461 75%, #2d3962 100%);
    }

    .roster h2 {
      position: relative;
      z-index: 1;
      margin: 0 0 17px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .roster ul {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }

    .roster li {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid rgba(195, 207, 249, .10);
      color: rgba(205, 211, 247, .76);
      font-size: 12px;
    }

    .avatar {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(195, 207, 249, .38);
      background:
        radial-gradient(circle at 35% 32%, #dbe3ff 0 8%, transparent 9%),
        radial-gradient(circle at 50% 72%, #8294c7 0 23%, transparent 24%),
        linear-gradient(145deg, #747ca8, #213159);
      box-shadow: 0 0 12px rgba(195, 207, 249, .14);
    }

    .status {
      margin-left: auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c3cff9;
      box-shadow: 0 0 8px #c3cff9;
    }

    @media (max-width: 720px) {
      .board { grid-template-columns: 1fr; }
      .roster { min-height: auto; }
    }

    @media (max-width: 430px) {
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="board">
    <section class="metrics" aria-label="Weather stats">
      <article class="card metric metric-77">
        <div class="metric-head"><span>Availability</span><span class="glyph">↻</span></div>
        <div><div class="value">77</div><div class="label">active nodes</div></div>
      </article>
      <article class="card metric metric-450">
        <div class="metric-head"><span>Growth rate</span><span class="glyph">↗</span></div>
        <div><div class="value">4.50%</div><div class="label">monthly delta</div></div>
      </article>
      <article class="card metric metric-6">
        <div class="metric-head"><span>System load</span><span class="glyph">⌁</span></div>
        <div><div class="value">6%</div><div class="label">current usage</div></div>
      </article>
      <article class="card metric metric-53">
        <div class="metric-head"><span>Capacity</span><span class="glyph">◫</span></div>
        <div><div class="value">53%</div><div class="label">network volume</div></div>
      </article>
    </section>

    <article class="card roster">
      <h2>Peer Clients</h2>
      <ul>
        <li><span class="avatar"></span>North sector<span class="status"></span></li>
        <li><span class="avatar"></span>Relay hub<span class="status"></span></li>
        <li><span class="avatar"></span>Orbit lane<span class="status"></span></li>
        <li><span class="avatar"></span>Core link<span class="status"></span></li>
        <li><span class="avatar"></span>Edge node<span class="status"></span></li>
      </ul>
    </article>
  </main>
</body>
</html>
