<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dunciers — cards</title>
<!-- Font: Inter (geometric sans; no glyph ID run) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/*
  PIL on reference.jpg (bbox sample, no crop files)
  bg tl #1e222d · moon #f9d3bf · trees #8c5b33
  glass fill #36324b / #2f2f42 · purple #5f4f71
  accent hot #f78851 · mean #c77152 · rim TL glass ~#9b5d55 bleed
*/
:root {
  --bg-tl: #1e222d;
  --bg-tr: #292f3b;
  --bg-bl: #0d111a;
  --bg-br: #141823;
  --sky: #1b182c;
  --sky-r: #423b4a;
  --moon: #f9d3bf;
  --peak: #8f594f;
  --trees: #8c5b33;

  --glass-a: #36324b;   /* media fill */
  --glass-b: #2f2f42;   /* controls fill */
  --glass-c: #312c32;   /* form fill */
  --glass-d: #4a3f52;   /* list fill */
  --purple: #5f4f71;

  --rim-hi: rgba(255, 230, 240, 0.28);
  --rim-mid: rgba(95, 79, 113, 0.45);
  --rim-lo: rgba(20, 18, 32, 0.35);

  --accent-hot: #f78851;
  --accent-mean: #c77152;
  --accent-deep: #9b5d55;

  --text: #e0ced9;
  --text-bright: #f4eef2;
  --muted: #b27a80;
  --label: #a898b0;

  --radius: 22px;
  --radius-sm: 14px;
  --font: "Inter", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 40px 32px 56px;
  /* landscape-ish page: dark sky + moon bloom + warm ground */
  background:
    radial-gradient(ellipse 42% 32% at 50% 14%, color-mix(in srgb, var(--moon) 55%, transparent), transparent 70%),
    radial-gradient(ellipse 50% 40% at 48% 55%, color-mix(in srgb, var(--peak) 28%, transparent), transparent 65%),
    radial-gradient(ellipse 55% 35% at 45% 82%, color-mix(in srgb, var(--trees) 35%, transparent), transparent 60%),
    radial-gradient(ellipse 40% 30% at 78% 22%, color-mix(in srgb, var(--sky-r) 50%, transparent), transparent 55%),
    linear-gradient(180deg, var(--sky) 0%, var(--bg-tl) 38%, var(--bg-bl) 100%);
}

.wrap { max-width: 980px; margin: 0 auto; }
.meta {
  margin: 0 0 24px;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--label);
  font-weight: 600;
}

.board {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr 0.7fr;
  grid-template-rows: auto auto auto;
  gap: 16px;
  align-items: start;
}
@media (max-width: 820px) {
  .board { grid-template-columns: 1fr; }
}

/* glass shell */
.card {
  position: relative;
  isolation: isolate;
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  overflow: hidden;
  color: var(--text);
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: var(--border-grad);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  z-index: 3;
}
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--flare);
  pointer-events: none;
  z-index: 1;
}
.card > * { position: relative; z-index: 4; }

.card-glass {
  background: linear-gradient(155deg,
    color-mix(in srgb, var(--glass-d) 75%, transparent) 0%,
    color-mix(in srgb, var(--glass-a) 68%, transparent) 45%,
    color-mix(in srgb, var(--glass-b) 62%, transparent) 100%);
  backdrop-filter: blur(22px) saturate(1.2);
  -webkit-backdrop-filter: blur(22px) saturate(1.2);
  --border-grad: linear-gradient(
    145deg,
    var(--rim-hi) 0%,
    var(--rim-mid) 28%,
    rgba(47, 47, 66, 0.2) 55%,
    var(--rim-lo) 100%
  );
  --flare: radial-gradient(90% 70% at 8% 0%, rgba(255, 220, 230, 0.12) 0%, transparent 50%);
  box-shadow:
    inset 0 1px 0 rgba(255, 240, 250, 0.12),
    0 18px 40px rgba(8, 10, 20, 0.45);
}

.card-accent {
  background: linear-gradient(135deg, var(--accent-hot) 0%, var(--accent-mean) 48%, var(--accent-deep) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  --border-grad: linear-gradient(145deg, rgba(255, 220, 180, 0.55) 0%, rgba(180, 60, 40, 0.2) 60%, rgba(80, 30, 30, 0.35) 100%);
  --flare: radial-gradient(80% 60% at 20% 0%, rgba(255,255,255,0.35) 0%, transparent 55%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 14px 32px rgba(200, 80, 40, 0.35);
  color: #fff8f4;
}

.title {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 0.02em;
}
.card-accent .title { margin-bottom: 6px; }

/* media card */
.media-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.orb {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(20, 18, 36, 0.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  display: grid;
  place-items: center;
}
.orb svg { width: 14px; height: 14px; opacity: 0.85; }
.icon-row {
  display: flex;
  gap: 14px;
  margin-bottom: 14px;
  opacity: 0.75;
}
.icon-row svg { width: 16px; height: 16px; }
.slider {
  height: 6px;
  border-radius: 999px;
  background: rgba(15, 12, 28, 0.55);
  position: relative;
  margin-top: 4px;
}
.slider::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 58%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--purple), color-mix(in srgb, var(--text) 40%, var(--purple)));
}
.slider-knob {
  position: absolute;
  left: 58%;
  top: 50%;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: var(--text-bright);
  box-shadow: 0 0 10px rgba(224, 206, 217, 0.5);
}
.slider-lab {
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--label);
}

/* list rows */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}
.row .ico {
  width: 28px;
  height: 28px;
  border-radius: 10px;
  background: rgba(20, 16, 36, 0.4);
  border: 1px solid rgba(255,255,255,0.1);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.row .ico svg { width: 13px; height: 13px; opacity: 0.8; }
.row .lab { flex: 1; color: var(--text); font-weight: 500; }
.row .val { color: var(--label); font-size: 11px; }

/* status */
.stat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.stat-item:last-of-type { border-bottom: 0; }
.pct {
  margin-top: 12px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-bright);
}
.pct span { font-size: 12px; font-weight: 500; color: var(--label); margin-right: 6px; }

/* form */
.field {
  height: 36px;
  border-radius: 12px;
  background: rgba(15, 12, 24, 0.4);
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 12px;
  color: var(--label);
}
.search {
  margin-top: 8px;
  height: 38px;
  border-radius: 999px;
  background: rgba(20, 16, 32, 0.5);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
  font-size: 12px;
  color: var(--label);
}

/* accent card content */
.accent-ico {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: grid;
  place-items: center;
  margin-bottom: 8px;
}
.accent-sub { margin: 0; font-size: 11px; opacity: 0.85; }

.col-right { display: flex; flex-direction: column; gap: 14px; }
.span-media { grid-column: 1; grid-row: 1; }
.span-list { grid-column: 2; grid-row: 1 / span 2; }
.span-right { grid-column: 3; grid-row: 1 / span 3; }
.span-status { grid-column: 1; grid-row: 2 / span 2; }
.span-form { grid-column: 2; grid-row: 3; }
@media (max-width: 820px) {
  .span-media, .span-list, .span-right, .span-status, .span-form { grid-column: 1; grid-row: auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <p class="meta">Dunciers · cards</p>

  <div class="board">
    <article class="card card-glass span-media">
      <p class="title">Dunciers</p>

        <span class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>

      <article class="card card-glass">
        <p class="title">Songpool</p>
        <div class="rows">

          <div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="lab">Reveal</span></div>
          <div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><span class="lab">Track</span></div>
        </div>
      </article>

      <article class="card card-glass">
        <p class="title">Progrmador</p>
        <div class="slider" style="margin-bottom:12px"><span class="slider-knob" style="left:42%"></span></div>

          <div class="row"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18v14H3z"/><path d="M3 7l3-4h12l3 4"/></svg></span><span class="lab">Folder</span></div>

        </div>

    </div>

    <article class="card card-glass span-status">
      <div class="stat-item">

        <span class="lab" style="flex:1;font-size:12px;font-weight:500">Timer</span>

    <article class="card card-glass span-form">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

</div>
</body>
